[project]
name = "brooms"
version = "0.1.0"
description = "Book University of Bath study rooms (bath.libcal.com) from Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel Werneck" }]
keywords = ["university-of-bath", "libcal", "study-room", "library", "booking", "scraper"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/gwerneckp/brooms"
Issues = "https://github.com/gwerneckp/brooms/issues"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]
media = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["assets/", "tests/fixtures/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the real site (read-only, no account needed)"]
